services:
  blog:
    image: jkjoy/simple-php-blog:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - blog-data:/app/data
      - blog-cache:/app/cache
      - blog-uploads:/app/uploads
      - blog-themes:/app/themes
      - blog-plugins:/app/plugins

volumes:
  blog-data:
  blog-cache:
  blog-uploads:
  blog-themes:
  blog-plugins:
