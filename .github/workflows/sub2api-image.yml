name: Build and publish sub2api-image

on:
  push:
    branches: [main]
    paths:
      - "sub2api-image/**"
      - ".github/workflows/sub2api-image.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: jkjoy/sub2api-image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sub2api-image/package-lock.json
      - name: Test image studio
        working-directory: sub2api-image
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Extract commit ID
        id: meta
        run: echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./sub2api-image
          file: ./sub2api-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.commit }}
          cache-from: type=gha,scope=sub2api-image
          cache-to: type=gha,mode=max,scope=sub2api-image
