name: Build And Upload Image For qq-channel

on:
  push:
    branches: [main]
    paths:
      - "qq-channel/**"
      - ".github/workflows/qq-channel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qq-channel/package-lock.json
      - name: Test channel and Tencent SDK
        working-directory: qq-channel
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Extract commit ID
        run: echo "COMMIT_ID=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: ./qq-channel
          file: ./qq-channel/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USER_NAME }}/qq-channel:latest
            ${{ secrets.DOCKER_USER_NAME }}/qq-channel:${{ env.COMMIT_ID }}
          cache-from: type=gha,scope=qq-channel
          cache-to: type=gha,mode=max,scope=qq-channel
